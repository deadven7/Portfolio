<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amaan Vora — Data Scientist</title>
  <meta name="description" content="Amaan Vora — data scientist and ML engineer. Interactive projects, work and certifications.">
  <link rel="icon" href="assets/img/av-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <!-- HERO -->
  <header class="hero" id="hero">
    <canvas class="bg" id="heroCanvas" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <div class="wrap">
      <h1 class="headline" id="headline" aria-label="data. demystified."></h1>
      <div class="socials" data-socials></div>
    </div>
    <div class="scroll-cue">SCROLL<i></i></div>
  </header>

  <!-- one continuous field behind every section below the hero -->
  <canvas class="field" id="field" aria-hidden="true"></canvas>

  <!-- ABOUT -->
  <section class="section home-about" id="about" data-motif="flow">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <h2 class="title">Rigour of a statistician,<br>reach of an engineer.</h2>
        </div>
        <a class="btn" href="about.html">the full story <span class="arr">→</span></a>
      </div>
      <div class="story-home" id="storyHome"></div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section class="section" id="projects" data-motif="clusters">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <h2 class="title">Projects</h2>
          <p class="lede">Every project has a live lab — real models running in your browser, not screenshots.</p>
        </div>
        <a class="btn" href="projects.html">all projects <span class="arr">→</span></a>
      </div>
      <div class="cards" id="featured"></div>
    </div>
  </section>

  <!-- WORK -->
  <section class="section" id="work" data-motif="series">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <h2 class="title">Work</h2>
        </div>
      </div>
      <div class="timeline-scroller">
        <div class="timeline" id="timeline"><div class="axis"><i></i></div></div>
      </div>
    </div>
  </section>

  <!-- CERTS -->
  <section class="section" id="certs" data-motif="constellation">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <h2 class="title">Certifications</h2>
        </div>
      </div>
      <div class="certs" id="certGrid"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox"><figure><img alt=""><figcaption></figcaption></figure></div>

  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script src="js/minis.js"></script>
  <script src="js/home.js"></script>
  <script src="js/field.js"></script>
</body>
</html>
